<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5"><meta name="description" content="Cantus est une liseuse MusicXML hors-ligne. Ouvrez et visualisez vos partitions musicales au format MusicXML et MXL avec une interface intuitive et un rendu haute qualité."><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Partitions"><meta name="theme-color" content="#ffffff"><meta name="keywords" content="MusicXML, partitions, musique, liseuse, offline, PWA, cantus, score, sheet music"><meta name="author" content="Cantus"><link rel="manifest" href="manifest.json"><link rel="icon" href="favicon.ico" type="image/x-icon"><link rel="apple-touch-icon" href="icons/icon-192.png"><title>Liseuse MusicXML</title><style>* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: #ffffff;
  color: #333;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}

#reader {
  position: relative;
  width: 100%;
  height: 100%;
}

#score-container {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
  scroll-behavior: auto;
}

.svg-slot {
  position: absolute;
  top: 0;
  width: 100%;
  height: 100%;
  overflow-x: hidden;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

.scroll-wrapper {
  display: flex;
  width: 200vw;
  min-height: 100%;
  transition: transform 0.35s ease;
  will-change: transform;
}

.scroll-wrapper.vertical {
  flex-direction: column;
  width: 100%;
  min-height: auto;
  transition: none;
  transform: none;
}

.loading-placeholder {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100vh;
  width: 100vw;
  background: #f8f9fa;
  color: #666;
  font-size: 1.2rem;
  text-align: center;
}

.scroll-page {
  width: 100vw;
  flex-shrink: 0;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  position: relative;
}

/* Ligne grise au chevauchement vertical */
.scroll-wrapper.vertical .scroll-page::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 5%;
  right: 5%;
  height: 1px;
  background: linear-gradient(to right, transparent, #ccc 20%, #ccc 80%, transparent);
  pointer-events: none;
}

/* Ligne grise au chevauchement horizontal */
.scroll-wrapper:not(.vertical) .scroll-page::after {
  content: '';
  position: absolute;
  top: 5%;
  bottom: 5%;
  right: 0;
  width: 1px;
  background: linear-gradient(to bottom, transparent, #ccc 20%, #ccc 80%, transparent);
  pointer-events: none;
}

.scroll-page svg {
  max-width: 100%;
  height: auto;
}

#page-prev {
  left: -100%;
}

#page-current {
  left: 0;
}

#page-next {
  left: 100%;
}

#tap-left, #tap-right {
  position: absolute;
  top: 0;
  height: 100%;
  z-index: 10;
}

#tap-left {
  left: 0;
  width: 30%;
}

#tap-right {
  right: 0;
  width: 30%;
}

#overlay-loading {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(255,255,255,0.95);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 100;
}

#overlay-loading.hidden {
  display: none;
}

#overlay-loading .spinner {
  width: 48px;
  height: 48px;
  border: 4px solid #ddd;
  border-top-color: #333;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

#overlay-loading p {
  margin-top: 16px;
  font-size: 14px;
  color: #666;
}

#overlay-error {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(255,255,255,0.95);
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 20px;
  text-align: center;
}

#overlay-error.visible {
  display: flex;
}

#overlay-error p {
  color: #c00;
  font-size: 14px;
  max-width: 80%;
}

#import-section {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  background: #fff;
  z-index: 5;
}

#import-section.hidden {
  display: none;
}

#import-section h1 {
  font-size: 22px;
  font-weight: 600;
  color: #000;
}

#import-section p {
  font-size: 14px;
  color: #555;
}

#import-btn {
  padding: 12px 32px;
  font-size: 16px;
  background: #333;
  color: #fff;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}

#import-btn:active {
  background: #555;
}

#install-section {
  margin-top: 24px;
  text-align: center;
}

#install-section.hidden {
  display: none;
}

#btn-install {
  padding: 12px 32px;
  font-size: 16px;
  background: #1976d2;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  margin-bottom: 8px;
  transition: background-color 0.2s ease;
  font-weight: 600;
}

#btn-install:hover {
  background: #1565c0;
}

#btn-install:active {
  background: #0d47a1;
}

.install-subtitle {
  font-size: 12px;
  color: #666;
  font-style: italic;
}

#file-input {
  display: none;
}

#btn-settings {
  position: fixed;
  bottom: 1vh;
  right: 1vh;
  z-index: 30;
  background: rgba(255,255,255,0.85);
  border: 1px solid #ddd;
  border-radius: 1vh;
  padding: 1vh 1.5vh;
  font-size: 2.5vh;
  cursor: pointer;
  color: #333;
  line-height: 1;
}

#btn-settings.hidden {
  display: none;
}

#settings-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: #fff;
  z-index: 50;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

#settings-overlay.hidden {
  display: none;
}

#settings-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;
  border-bottom: 1px solid #eee;
}

#settings-header h2 {
  font-size: 18px;
  font-weight: 600;
}

#settings-close {
  background: none;
  border: none;
  font-size: 22px;
  cursor: pointer;
  color: #666;
  padding: 4px 8px;
}

.settings-group {
  padding: 16px 20px;
  border-bottom: 1px solid #f0f0f0;
}

.settings-label {
  display: block;
  font-size: 14px;
  font-weight: 600;
  color: #333;
  margin-bottom: 10px;
}

.settings-row {
  display: flex;
  align-items: center;
  gap: 10px;
}

#zoom-range {
  flex: 1;
  height: 4px;
  accent-color: #333;
}

#zoom-value {
  font-size: 14px;
  color: #666;
  min-width: 28px;
  text-align: center;
}

.theme-btn, .tap-btn {
  flex: 1;
  padding: 8px 4px;
  font-size: 13px;
  border: 1px solid #ddd;
  border-radius: 6px;
  background: #f5f5f5;
  color: #333;
  cursor: pointer;
}

.theme-btn.active, .tap-btn.active {
  background: #333;
  color: #fff;
  border-color: #333;
}

body.theme-sepia {
  background: #f4ecd8;
}

body.theme-sepia #score-container {
  filter: sepia(0.3);
}

body.theme-sepia #overlay-loading,
body.theme-sepia #import-section {
  background: rgba(244,236,216,0.95);
}

body.theme-sepia #import-section h1 {
  color: #2c1810;
}

body.theme-sepia #import-section p {
  color: #5a4a3a;
}

body.theme-dark {
  background: #1a1a1a;
  color: #ddd;
}

body.theme-dark #score-container {
  filter: invert(1);
}

body.theme-dark #overlay-loading {
  background: rgba(26,26,26,0.95);
}

body.theme-dark #overlay-loading .spinner {
  border-color: #444;
  border-top-color: #ccc;
}

  color: #999;
}

body.theme-dark #import-section {
  background: transparent;

  color: #fff;

body.theme-dark #import-section p {

body.theme-dark #btn-install:hover {

}

.library-item {

  align-items: center;
  padding: 14px 20px;
  border-bottom: 1px solid #f0f0f0;
  cursor: pointer;
}

.library-item:active {
  background: #f5f5f5;
}

.library-item-info {
  flex: 1;
  min-width: 0;
}

.library-item-name {
  font-size: 15px;
  color: #333;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.library-item-date {
  font-size: 12px;
  color: #999;
  margin-top: 2px;
}

.library-item-delete {
  background: none;
  border: none;
  color: #c00;
  font-size: 18px;
  cursor: pointer;
  padding: 4px 8px;
  margin-left: 12px;

#library-actions {
