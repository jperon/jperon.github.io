<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/><link rel="manifest" href="manifest.json"/><link rel="stylesheet" href="styles.css"/><title>Circular Slide Rule</title></head><body><div id="app"><canvas id="ruler" aria-label="Circular slide rule"></canvas><div id="readout"><div class="readout-title">Cursor Readout</div><div id="readout-values"></div></div><div id="controls"><button class="hidden" id="update-available" type="button">⟳ Update</button><button id="toggle-panel" type="button">⚙ Scales</button><button id="reset" type="button">↺ Reset</button></div><div class="hidden" id="panel"><div class="panel-header"><h2>Scale Configuration</h2><button id="close-panel" type="button">✕</button></div><div class="panel-section"><h3>Rings</h3><button id="add-ring" type="button">+ Add ring</button><div id="circle-list"></div></div><div class="panel-section"><h3>Display</h3><div class="display-controls"><label for="min-tick-angle">Min tick angle (°)</label><input id="min-tick-angle" type="range" min="0.5" max="5" step="0.1" value="1.5"/><span id="min-tick-angle-val">1.5</span></div></div><div class="panel-section"><h3>Custom Scales</h3><div id="scale-editor"><div class="scale-form"><input id="scale-label" type="text" placeholder="Label (e.g. LL1)"/><input id="scale-formula" type="text" placeholder="Formula (e.g. Math.log10(-Math.log(x)))"/><div class="scale-form-row"><input id="scale-min" type="number" placeholder="Min" step="any"/><input id="scale-max" type="number" placeholder="Max" step="any"/><input id="scale-decades" type="number" placeholder="Decades (auto)" step="any"/></div><input id="scale-color" type="color" value="#00e5ff"/><button id="add-scale" type="button">+ Add Scale</button></div></div><div id="scale-list"></div></div><div class="panel-section"><h3>Import / Export</h3><div class="io-buttons"><button id="export-scales" type="button">Export JSON</button><button id="import-scales" type="button">Import JSON</button></div><textarea id="io-textarea" placeholder="Paste scale JSON here..." rows="4"></textarea></div></div></div><script src="scales.js?v=40"></script><script src="ruler.js?v=40"></script><script src="app.js?v=40"></script></body></html>
